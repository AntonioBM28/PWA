# La configuracion vive en este archivo; no se usa servidor de Spring Cloud Config.
spring.cloud.config.enabled=false

# ===== Configuracion del Servidor (Para despliegue en Render) =====
# Render inyecta la variable de entorno PORT; si no existe, usa 8080.
server.port=${PORT:8080}

# ===== PostgreSQL - Supabase (tokens GestoPago y onboarding) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===== GestoPago - Autenticacion (JWT) =====
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:}
gestopago.api-key=${GESTOPAGO_API_KEY:}
gestopago.payload.secret-key=${GESTOPAGO_PAYLOAD_SECRET_KEY:}
gestopago.payload.iv=${GESTOPAGO_PAYLOAD_IV:}
gestopago.payload.replay-key=${GESTOPAGO_REPLAY_ENCRYPTION_KEY:}
gestopago.transacciones.unidad=${GESTOPAGO_UNIDAD:}
gestopago.transacciones.timeout-ms=${GESTOPAGO_TRANSACTION_TIMEOUT_MS:70000}
gestopago.transacciones.confirmacion-espera-segundos=${GESTOPAGO_CONFIRMATION_DELAY_SECONDS:72}
gestopago.transacciones.monto-min=${GESTOPAGO_TRANSACTION_AMOUNT_MIN:0.01}
gestopago.transacciones.monto-max=${GESTOPAGO_TRANSACTION_AMOUNT_MAX:100000.00}
gestopago.transacciones.zona-horaria=${GESTOPAGO_TRANSACTION_TIME_ZONE:America/Mexico_City}
gestopago.auth.refresh-rate-ms=3600000

# ===== GestoPago - Catalogo de productos =====
gestopago.productos.url=https://gestopago.portalventas.net
# Token Bearer estatico. Si se deja vacio se usa el token vigente renovado por GestoPagoTokenService.
gestopago.productos.token=${GESTOPAGO_BEARER_TOKEN:}
spring.cloud.openfeign.client.config.gestoPagoProductos.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProductos.read-timeout=10000
spring.cloud.openfeign.client.config.gestoPagoTransacciones.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoTransacciones.read-timeout=${GESTOPAGO_TRANSACTION_TIMEOUT_MS:70000}
# Sincronizacion del catalogo GestoPago -> MongoDB (todos los dias 06:00, hora de Mexico)
gestopago.productos.cron=0 0 6 * * *
gestopago.productos.cron-zona=America/Mexico_City
gestopago.productos.carga-al-iniciar=true
gestopago.productos.coleccion=cat_products

# ===== API de codigos postales (postali.app, sin autenticacion; solo Mexico) =====
codigo-postal.url=https://postali.app/api/v1/mx
spring.cloud.openfeign.client.config.codigoPostal.connect-timeout=3000
spring.cloud.openfeign.client.config.codigoPostal.read-timeout=5000

# ===== MongoDB Atlas - Catalogo de productos =====
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:}
spring.data.mongodb.database=gestoPago

# ===== Onboarding de clientes =====
# Saldo con el que se crea la cuenta de cada cliente nuevo (no puede ser negativo)
onboarding.cuenta.saldo-inicial=0.00
# Zona horaria con la que se interpretan los filtros de fecha de registro (AAAA-MM-DD)
onboarding.zona-horaria=America/Mexico_City

# ===== Seguridad - JWT (login de clientes) =====
# Llave HS256 en Base64 (256 bits) con la que se firman y validan los tokens
onboarding.jwt.secreto=${ONBOARDING_JWT_SECRETO:}
# Vigencia del token en minutos
onboarding.jwt.expiracion-minutos=60

# ===== Seguridad - Usuario EJECUTIVO inicial =====
# Se crea al arrancar si no existe (no se sobrescribe si ya existe). Administra a todos los clientes.
onboarding.ejecutivo.correo=ejecutivo@banco.com
onboarding.ejecutivo.password=${ONBOARDING_EJECUTIVO_PASSWORD:}

# ===== Seguridad - Proteccion contra fuerza bruta =====
# Peticiones por minuto desde una misma IP (responde 429 al superarlo)
onboarding.limite.login-por-minuto=10
onboarding.limite.registro-por-minuto=5
# Contrasenas incorrectas para un mismo correo antes de bloquearlo, y minutos de bloqueo
onboarding.login.max-intentos-fallidos=5
onboarding.login.bloqueo-minutos=15
# Tamano maximo del cuerpo de una peticion (responde 413 al superarlo)
onboarding.limite.cuerpo-max-kb=64

# ===== Errores HTTP =====
# Nunca devolver el stack trace ni detalles internos en las respuestas de error (devtools los activa por defecto)
server.error.include-stacktrace=never
server.error.include-message=never
